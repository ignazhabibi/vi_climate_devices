name: CI/CD Pipeline

env:
  PYTHON_VERSION: "3.14"

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  quality-check:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v') || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    - name: Install
      run: |
        python -m pip install --upgrade pip
        python -m pip install build
        python -m pip install '.[dev]'
    - name: Quality check
      run: python scripts/quality_check.py

  release:
    needs: quality-check
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Build
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Fetch Tag Message
      id: tag_message
      run: |
        git fetch --depth=1 origin +refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}
        # A tag created on GitHub is lightweight; its "message" would be the
        # commit body, so keep the release text written on GitHub instead.
        TAG_MSG=""
        if [ "$(git cat-file -t refs/tags/${{ github.ref_name }})" = "tag" ]; then
          TAG_MSG=$(git tag -l --format='%(contents:body)' ${{ github.ref_name }})
        fi
        echo "body<<EOF" >> $GITHUB_OUTPUT
        echo "$TAG_MSG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    - name: GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        body: ${{ steps.tag_message.outputs.body }}
        generate_release_notes: false
