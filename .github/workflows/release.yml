name: CI/CD Pipeline

env:
  PYTHON_VERSION: "3.14"

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  quality-check:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v') || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    - name: Install
      run: |
        python -m pip install --upgrade pip
        python -m pip install build
        python -m pip install '.[dev]'
    - name: Quality check
      run: python scripts/quality_check.py

  release:
    needs: quality-check
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Build
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Resolve Release Notes
      # An annotated tag message wins. A tag created on GitHub is lightweight,
      # so the notes come from the "# Changelog" section of the pull request
      # that merged the tagged commit. Without either, the release keeps the
      # description written on GitHub.
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        NOTES="${RUNNER_TEMP}/release-notes.md"
        : > "${NOTES}"
        git fetch --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
        if [ "$(git cat-file -t "refs/tags/${TAG}")" = "tag" ]; then
          git tag -l --format='%(contents:body)' "${TAG}" > "${NOTES}"
        else
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[0].body // ""' \
            | tr -d '\r' \
            | awk '/^# Changelog[[:space:]]*$/ { found = 1 }
                   found && (/^## / || /^---[[:space:]]*$/) { exit }
                   found { print }' > "${NOTES}"
        fi
        if [ ! -s "${NOTES}" ]; then
          echo "::warning::No changelog found; keeping the release description"
        fi
    - name: GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        body_path: ${{ runner.temp }}/release-notes.md
        generate_release_notes: false
